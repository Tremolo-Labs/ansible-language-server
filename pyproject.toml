[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ansible-language-server"
version = "0.1.0"
description = "Language Server Protocol implementation for Ansible"
requires-python = ">=3.10"
readme = "README.md"
license = {text = "GPL3"}
dependencies = [
    "pygls>=1.3.0",
    "ruamel.yaml>=0.18.0",
    "attrs>=23.0.0",
    "tree-sitter>=0.23.0",
    "lsprotocol>=2025.0.0",
    "ansible-runner>=2.4.0",
    "tree-sitter-yaml>=0.7.2",
    "tree-sitter-jinja>=0.3.3",
    "ansible>=10.7.0",
    "jinja2>=3.1.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "thefuzz>=0.22.0",
]

[project.scripts]
ansible-language-server = "ansible_ls.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ansible_ls"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.mypy]
strict = true
